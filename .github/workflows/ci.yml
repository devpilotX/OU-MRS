name: CI

on:
  push:
    branches: [ phase-8g-multi-instrument, main, develop ]
  pull_request:
    branches: [ phase-8g-multi-instrument, main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint (py_compile all .py files)
        run: |
          python -m compileall -q -f strategy.py regime.py ou_mrs.py backtest.py cost_model.py prop_firm_monitor.py walk_forward.py

      - name: Run tests
        run: |
          python -m pytest tests/ -v --deselect tests/test_prop_firm_monitor.py::test_hard_halt_max_dd
