<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OU-MRS · Sign in</title>
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
  <link rel="stylesheet" href="/static/css/login.css">
</head>
<body class="login-page">
  <div class="login-shell">
    <div class="login-card">
      <div class="login-brand">
        <div class="login-mark">OU</div>
        <div class="login-title">OU-MRS</div>
        <div class="login-sub">Pro Trading Dashboard</div>
      </div>
      <form method="post" action="/login" class="login-form" autocomplete="on">
        <label class="login-field">
          <span class="login-lbl">Username</span>
          <input type="text" name="username" required autofocus autocomplete="username">
        </label>
        <label class="login-field">
          <span class="login-lbl">Password</span>
          <input type="password" name="password" required autocomplete="current-password">
        </label>
        <button type="submit" class="login-btn">Sign in</button>
      </form>
      <div class="login-foot">Paper trading mode · Live mode requires manual unlock</div>
    </div>
  </div>
</body>
</html>
